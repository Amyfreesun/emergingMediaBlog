<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Amy Freesun — Emerging Media 1 blog for Hunter College Integrated Media Arts."
  />
  <title>Amy Freesun — Emerging Media 1</title>

  <style>
    :root {
      --orange: #ff6a00;
      --ice-blue: #dff7ff;
      --raspberry: #a31346;
      --deep-raspberry: #64102f;
      --ink: #241a55;
      --cream: #fff9f4;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 20% 18%, rgba(255,255,255,0.48), transparent 28%),
        linear-gradient(
          155deg,
          var(--ice-blue) 0%,
          #f2edf1 24%,
          #ffb27b 55%,
          var(--orange) 73%,
          var(--raspberry) 100%
        );
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* Very subtle clouds */
    body::before {
      background:
        radial-gradient(ellipse at 12% 28%, rgba(255,255,255,0.26) 0 7%, transparent 8%),
        radial-gradient(ellipse at 19% 29%, rgba(255,255,255,0.18) 0 9%, transparent 10%),
        radial-gradient(ellipse at 74% 20%, rgba(255,255,255,0.16) 0 8%, transparent 9%),
        radial-gradient(ellipse at 82% 21%, rgba(255,255,255,0.12) 0 10%, transparent 11%),
        radial-gradient(ellipse at 48% 67%, rgba(255,255,255,0.10) 0 9%, transparent 10%);
      filter: blur(18px);
      opacity: 0.9;
    }

    /* Gentle atmospheric veil */
    body::after {
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0.12),
        rgba(255,255,255,0.02) 45%,
        rgba(95, 15, 45, 0.08)
      );
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 28px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    .name {
      font-size: 0.9rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
    }

    nav a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid rgba(37, 21, 28, 0.35);
      padding-bottom: 2px;
    }

    main {
      display: grid;
      place-items: center;
      padding: 80px 0;
    }

    .hero {
      width: min(900px, 100%);
      text-align: center;
    }

    .eclipse {
      width: clamp(120px, 18vw, 210px);
      aspect-ratio: 1;
      border-radius: 50%;
      margin: 0 auto 42px;
      position: relative;
      background: var(--deep-raspberry);
      box-shadow:
        0 0 0 8px rgba(255, 106, 0, 0.22),
        0 0 55px 16px rgba(255, 106, 0, 0.42),
        0 0 100px 30px rgba(223, 247, 255, 0.20);
    }

    .eclipse::before {
      content: "";
      position: absolute;
      width: 78%;
      height: 78%;
      border-radius: 50%;
      background: linear-gradient(
        145deg,
        #1f1420 0%,
        #301525 55%,
        #4a1730 100%
      );
      left: 19%;
      top: 7%;
      box-shadow:
        -18px 10px 24px rgba(255, 106, 0, 0.10);
    }

    .eyebrow {
      margin: 0 0 16px;
      color: var(--ink);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Trebuchet MS", "Avenir Next", Avenir, sans-serif;
      font-size: clamp(3.4rem, 9vw, 7.5rem);
      line-height: 0.92;
      letter-spacing: -0.035em;
      font-weight: 600;
    }

    .subtitle {
      margin: 28px auto 0;
      max-width: 680px;
      font-family: "Trebuchet MS", "Avenir Next", Avenir, sans-serif;
      font-size: clamp(1.1rem, 2.2vw, 1.55rem);
      line-height: 1.5;
    }

    .divider {
      width: 72px;
      height: 2px;
      background: var(--raspberry);
      margin: 34px auto;
      opacity: 0.7;
    }

    .intro {
      max-width: 620px;
      margin: 0 auto;
      font-size: 0.98rem;
      line-height: 1.7;
      opacity: 0.8;
    }

    footer {
      width: min(1200px, 100%);
      margin: 0 auto;
      padding-top: 20px;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.65;
    }

    @media (max-width: 640px) {
      .page {
        padding: 20px;
      }

      header {
        align-items: flex-start;
      }

      nav {
        display: none;
      }

      main {
        padding: 56px 0;
      }

      .eclipse {
        margin-bottom: 34px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <div class="name">Amy Freesun</div>
      <nav aria-label="Primary navigation">
        <a href="#blog">Emerging Media 1</a>
      </nav>
    </header>

    <main id="blog">
      <section class="hero">
        <div class="eclipse" aria-hidden="true"></div>

        <p class="eyebrow">Hunter College · Integrated Media Arts</p>

        <h1>Amy Freesun</h1>

        <p class="subtitle">
          A blog for Emerging Media 1,<br />
          Hunter College, Integrated Media Arts.
        </p>

        <div class="divider"></div>

        <p class="intro">
          Notes and projects from Emerging Media 1.
        </p>
      </section>
    </main>

    <footer>
      Emerging Media 1 · Hunter College · Integrated Media Arts
    </footer>
  </div>
</body>
</html>
